# Build Abysmal for every platform
#
# Builds Windows, macOS, Linux, Android, and Web from the Godot 4.7.2
# project in this repo. Runs on every push to main and on manual dispatch.
# Artifacts land on the run's page (Actions -> this run -> Artifacts).
#
# Android release signing: the release APK is signed ONLY when the
# ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets are set
# (keystore decoded to keystore/release.keystore, password injected into
# export_presets.cfg at build time — never committed). Without those
# secrets the Android job builds the Debug preset instead.
#
# iOS is intentionally NOT built here: Apple signing needs a $99/yr
# Developer account, and that decision is still open. See the commented
# placeholder job at the bottom. Consoles are not possible via GitHub
# Actions at all.

name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  windows:
    name: Windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot ${{ env.GODOT_VERSION }} + export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          godot --version
      - name: Export Windows
        run: |
          mkdir -p dist
          godot --headless --path . --export-release "Windows Desktop" dist/idle-dungeon-roguelike-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: abysmal-windows
          path: dist/idle-dungeon-roguelike-windows.exe

  macos:
    name: macOS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot ${{ env.GODOT_VERSION }} + export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          godot --version
      - name: Export macOS (unsigned)
        run: |
          mkdir -p dist
          godot --headless --path . --export-release "macOS" dist/idle-dungeon-roguelike-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: abysmal-macos
          path: dist/idle-dungeon-roguelike-macos.zip

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot ${{ env.GODOT_VERSION }} + export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          godot --version
      - name: Export Linux
        run: |
          mkdir -p dist
          godot --headless --path . --export-release "Linux" dist/idle-dungeon-roguelike-linux.x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: abysmal-linux
          path: dist/idle-dungeon-roguelike-linux.x86_64

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot ${{ env.GODOT_VERSION }} + export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          godot --version
      - name: Export Web
        run: |
          mkdir -p dist/web
          godot --headless --path . --export-release "Web" dist/web/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: abysmal-web
          path: dist/web

  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Godot ${{ env.GODOT_VERSION }} + export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          godot --version
      - name: Restore release keystore from secrets
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore/release.keystore
          sed -i "s|^keystore/release_password=.*|keystore/release_password=\"$ANDROID_KEYSTORE_PASSWORD\"|" export_presets.cfg
      - name: Export Android (Release, signed)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p dist
          godot --headless --path . --export-release "Android (Release)" dist/idle-dungeon-roguelike-release.apk
      - name: Export Android (Debug — no signing secrets set)
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          mkdir -p dist
          godot --headless --path . --export-debug "Android (Debug)" dist/idle-dungeon-roguelike-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: abysmal-android
          path: dist/*.apk

  # ios:
  #   PLACEHOLDER ONLY — do not enable until the Apple signing decision
  #   is made. iOS export needs an Apple Developer account ($99/yr) and
  #   a signing certificate + provisioning profile stored as CI secrets.
  #   When that decision lands: add an "iOS" preset to export_presets.cfg
  #   and a job here that exports it on a macos-latest runner.
